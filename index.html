<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- The lecturer's view of every student: setup, lesson, checker tries, scores, memos.
     Reads the course database (teacher/course.sql); only emails in course.teachers can read it. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4F4F2; color: #1C1C1A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 24px; margin: 0; }
  h2 { font-size: 18px; margin: 0 0 4px; }
  .muted { color: #6B6B66; font-size: 13px; line-height: 1.5; }
  .card { background: #fff; border: 1px solid #E2E2DE; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
  button, select { font: inherit; font-size: 13.5px; border-radius: 8px; padding: 6px 10px; border: 1px solid #CFCFCA; background: #fff; color: #1C1C1A; cursor: pointer; }
  button.primary { background: #1C1C1A; color: #fff; border-color: #1C1C1A; }
  .linkish { background: none; border: none; color: #6B6B66; text-decoration: underline; padding: 0; }
  input { font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid #CFCFCA; border-radius: 8px; width: 100%; }
  .login { max-width: 360px; margin: 12vh auto 0; }
  .login label { display: block; font-size: 13px; color: #6B6B66; margin: 14px 0 6px; }
  .login button { margin-top: 18px; width: 100%; padding: 10px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bad { color: #B42318; } .ok { color: #1F7A3F; }
  #note { margin: 0; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 8px; background: #fff; border: 1px solid #E2E2DE; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #EEEEEA; vertical-align: middle; }
  th { color: #6B6B66; font-weight: 600; font-size: 12.5px; background: #FAFAF8; white-space: nowrap; }
  td .row { flex-wrap: nowrap; }
  select[data-move] { max-width: 170px; }
  tr.st { cursor: pointer; } tr.st:hover td { background: #FAFAF8; }
  tr.st.open td { background: #FEF7F2; }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin: 1px 3px 1px 0; background: #F0F0EC; color: #4A4A45; white-space: nowrap; }
  .chip.done { background: #E8F5EC; color: #1F7A3F; } .chip.part, .chip.wip { background: #FEF3C7; color: #92400E; }
  .chip.late { background: #FEE4E2; color: #B42318; } .chip.none { background: #F0F0EC; color: #8A8A85; }
  .scroll { overflow-x: auto; }
  .detail td { background: #FCFCFA; padding: 14px 18px 18px; }
  .pick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .pick button { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; }
  .pick button.on { background: #1C1C1A; color: #fff; border-color: #1C1C1A; }
  .lesson-block { border: 1px solid #EEEEEA; border-radius: 10px; padding: 10px 14px; background: #fff; }
  .lesson-block h3 { font-size: 14.5px; margin: 0 0 6px; }
  .qt { width: 100%; font-size: 13px; }
  .qt td { padding: 4px 8px; border-bottom: 1px solid #F2F2EE; vertical-align: top; }
  .qt td.qn { width: 28px; color: #8A8A85; font-weight: 700; }
  .qt td.qx { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #4A4A45; }
  .qt td.pts { width: 44px; text-align: right; font-weight: 700; }
  .qt td.ans { white-space: nowrap; color: #1F7A3F; font-weight: 600; }
  .qt .how-btn { display: block; margin-top: 4px; font-size: 12px; font-weight: 400; }
  .qt tr.how td { white-space: normal; background: #F7F7F4; font-size: 13px; color: #33332F; padding-top: 6px; padding-bottom: 8px; }
  .qt tr.how ol { margin: 0; padding-left: 20px; } .qt tr.how li { margin: 2px 0; }
  .lesson-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 6px; }
  .lesson-head h3 { margin: 0; }
  .resetbtn { background: #fff; color: #B42318; border: 1px solid #FECDCA; border-radius: 8px; padding: 3px 12px; font-size: 13px; cursor: pointer; }
  .resetbtn:hover { background: #FEF3F2; }
  .resetbar.armed { background: #FEF3F2; border: 1px solid #FECDCA; border-radius: 10px; padding: 10px 12px; margin: 4px 0 12px; font-size: 13.5px; line-height: 1.5; }
  .resetbar.armed button.danger { background: #B42318; color: #fff; border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; margin-left: 6px; }
  .qt .gu { white-space: normal; margin-top: 3px; font-size: 12.5px; color: #8A5A00; }
  details.m summary { cursor: pointer; font-size: 13px; color: #4A4A45; margin-top: 8px; }
  .tries { min-width: 260px; }
  .tries > span i { font-style: normal; opacity: .6; margin-right: 6px; }
  .cell { white-space: nowrap; } .cell span { opacity: .75; }
  .tries > span { display: inline-block; vertical-align: top; font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding: 1px 6px; border-radius: 5px; margin: 1px 4px 1px 0; background: #FEF3F2; color: #B42318; }
  .tries > span.r { background: #E8F5EC; color: #1F7A3F; }
  .memo { white-space: pre-wrap; font-size: 14px; line-height: 1.55; background: #FAFAF8; border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap login" id="login" hidden>
  <h1>Teacher sign-in</h1>
  <p class="muted">Your account in the course's Supabase project.</p>
  <form id="login-form">
    <label for="email">Email</label><input id="email" type="email" required autocomplete="username">
    <label for="password">Password</label><input id="password" type="password" required autocomplete="current-password">
    <button class="primary" type="submit">Sign in</button>
    <p class="bad" id="login-error"></p>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <h1>Teacher dashboard</h1>
    <p id="note" hidden></p>
    <div class="row"><button id="refresh">Refresh</button><button class="linkish" id="signout">Sign out</button></div>
  </header>

  <section class="card">
    <h2>Lesson for everyone</h2>
    <div class="row" style="margin-top:8px">
      <select id="all-lesson"></select><button class="primary" id="open-all">Apply</button>
      <span class="muted" id="all-since"></span>
    </div>
    <p class="muted" style="margin-top:8px" id="mode-note"></p>
  </section>

  <section class="card">
    <h2>Students</h2>
    <p class="muted" id="count"></p>
    <p class="muted"><span class="chip done">Submitted ✓</span> memo in, every answer right · <span class="chip wip">In guided walkthrough</span> panels built, no answers yet · <span class="chip wip">In progress</span> answering ·
      <span class="chip late">Not finished</span> moved past it without submitting · <span class="chip none">Not started</span></p>
    <div class="scroll"><table id="students"></table></div>
  </section>
</div>

<script>
  const COURSE_URL = 'https://vabrgxtwobrhmzcmwzer.supabase.co';
  const COURSE_KEY = 'sb_publishable_ZQhnI36Hc-V9Vhb4ch59ZQ_hE1P-5zc';
  const SITE = 'https://asafbarzilay-web.github.io/data-mindset-template/';   // the public course: lessons and questions
  const db = window.supabase.createClient(COURSE_URL, COURSE_KEY, { auth: { storageKey: 'teacher' } });
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let lessons = [], questions = {}, data = null, openStudent = null;

  // Score per question: right on try 1 = 100, 2 = 75, 3 = 50, 4 or later = 25, never right = 0.
  const POINTS = [100, 75, 50, 25];
  // A breakdown's answer ("row: value · row: value") as one row per line; an empty row shows "–".
  function cellsOf(a) {
    const parts = String(a ?? '').split(' · ');
    if (parts.length < 2 || !parts.every(p => p.includes(':'))) return esc(a);
    return parts.map(p => { const i = p.lastIndexOf(':'), v = p.slice(i + 1).trim();
      return `<div class="cell"><span>${esc(p.slice(0, i))}</span> <b>${v ? esc(v) : '–'}</b></div>`; }).join('');
  }
  function scoreQuestion(tries) {
    const i = tries.findIndex(t => t.is_right);
    return i < 0 ? 0 : POINTS[Math.min(i, 3)];
  }
  function lessonScore(student, l) {
    const qs = questions[l.checker] || [];
    if (!qs.length) return null;
    const mine = data.attempts.filter(a => a.student === student && a.lesson === l.checker);
    if (!mine.length) return null;
    return Math.round(qs.reduce((sum, q) => sum + scoreQuestion(mine.filter(a => a.question === q.id)), 0) / qs.length);
  }
  // Lessons to show for a student: everything up to their current lesson, plus any lesson they have work in.
  const hasWork = (student, l) => data.attempts.some(a => a.student === student && a.lesson === l.checker) || !!memoOf(student, l);
  const shownLessons = (s) => { const n = nOf(lessonOf(s)); return lessons.filter(l => l.checker && (l.n <= n || hasWork(s.student, l))); };
  const memoOf = (student, l) => data.memos.find(m => m.student === student && m.lesson === l.checker);
  // Where a lesson stands for a student: submitted (memo in, so every answer right), in progress,
  // not finished (the student has moved past it), or not started.
  function status(s, l) {
    const m = memoOf(s.student, l);
    if (m && m.submitted_at) return { key: 'done', label: 'Submitted' };
    if (l.n < nOf(lessonOf(s))) return { key: 'late', label: 'Not finished' };
    if (hasWork(s.student, l)) return { key: 'wip', label: 'In progress' };
    return hasPanels(s.student, l) ? { key: 'wip', label: 'In guided walkthrough' } : { key: 'none', label: 'Not started' };
  }
  // Panels the student's assistant built for this lesson: read from their published dashboard/boards.js
  // (the course server never sees them). Fetched once per student; a missing site counts as none.
  const boards = {};
  const hasPanels = (student, l) => {
    const t = boards[student];
    return !!(t && l.unit && new RegExp("['\"]" + l.unit + "['\"]\\s*:\\s*\\[\\s*[^\\s\\]]").test(t));
  };
  function loadBoards() {
    for (const s of data.students) {
      if (s.site && !(s.student in boards)) {
        boards[s.student] = null;
        fetch(s.site + 'dashboard/boards.js?t=' + Date.now()).then(r => r.ok ? r.text() : '').then(t => { boards[s.student] = t; render(); }).catch(() => {});
      }
    }
  }
  const lessonOf = s => s.lesson || data.state.lesson;
  const sinceOf = s => s.lesson ? s.lesson_since : data.state.since;
  const nOf = unit => (lessons.find(l => l.unit === unit) || {}).n;
  function ago(t) {
    if (!t) return '–';
    const m = (Date.now() - new Date(t)) / 60000;
    const days = Math.round(m / 1440);
    return m < 60 ? Math.round(m) + ' min' : m < 1440 ? Math.round(m / 60) + ' h' : days + (days === 1 ? ' day' : ' days');
  }
  const options = (sel, withFollow, withSelf) => (withFollow ? '<option value="">follow the course</option>' : '') +
    (withSelf ? `<option value="__self" ${sel === '__self' ? 'selected' : ''}>Self-paced</option>` : '') +
    lessons.filter(l => l.unit).map(l => `<option value="${l.unit}" ${l.unit === sel ? 'selected' : ''}>${l.n} · ${esc(l.title)}</option>`).join('');

  async function loadCourse() {
    lessons = await fetch(SITE + 'units/lessons.json', { cache: 'no-store' }).then(r => r.json());
    // The questions are the same for every student (only the numbers in them differ), so any name will do for the list.
    for (const l of lessons.filter(l => l.checker)) {
      questions[l.checker] = await server({ action: 'questions', student: 'course/list', lesson: l.checker })
        .then(j => j.questions).catch(() => []);
    }
  }
  // The course server: every student has their own data, so their own right answers.
  const COURSE_FN = COURSE_URL + '/functions/v1/course';
  async function server(body) {
    const { data: { session } } = await db.auth.getSession();
    const res = await fetch(COURSE_FN, { method: 'POST', body: JSON.stringify(body), headers: {
      'Content-Type': 'application/json', apikey: COURSE_KEY, ...(session ? { Authorization: 'Bearer ' + session.access_token } : {}) } });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || 'the course server did not answer');
    return j;
  }
  // How a right answer is reached, step by step with this student's numbers: fetched on a click.
  const explained = {};
  function howRow(k) {
    const h = explained[k]; if (!h) return '';
    const body = h === 'loading' ? '<span class="muted">Loading…</span>' : typeof h === 'string' ? `<span class="muted">${esc(h)}</span>`
      : `<ol>${h.map(line => `<li>${esc(line)}</li>`).join('')}</ol>`;
    return `<tr class="how"><td></td><td colspan="4">${body}</td></tr>`;
  }
  async function explain(k) {
    if (explained[k]) { delete explained[k]; render(); return; }
    const [student, lesson, question] = k.split('|');
    explained[k] = 'loading'; render();
    try { const j = await server({ action: 'explain', student, lesson, question }); explained[k] = j.how.length ? j.how : 'No explanation for this question yet.'; }
    catch (e) { explained[k] = 'Could not load: ' + e.message; }
    render();
  }
  // This student's own questions and right answers, fetched when their row opens.
  const answers = {};
  function answersFor(student, lesson) {
    const k = student + '|' + lesson;
    if (!(k in answers)) {
      answers[k] = null;
      server({ action: 'answers', student, lesson }).then(j => { answers[k] = j.questions; render(); }).catch(() => { answers[k] = []; });
    }
    return answers[k] || [];
  }


  const DEMO = false;   // the demo exists only in the private copy
  const demoData = () => null;

  async function load() {
    if (DEMO) { data = data || demoData(); render(); return; }
    const { data: d, error } = await db.rpc('course_overview');
    if (error) { $('count').innerHTML = `<span class="bad">${esc(error.message)}</span>`; return; }
    data = d; loadBoards();
    // A link from a "lesson done" email (?student=…&lesson=…) opens that student on that lesson, once.
    const q = new URLSearchParams(location.search);
    if (q.get('student') && !load.opened) {
      load.opened = true;
      openStudent = q.get('student');
      if (q.get('lesson')) picked[openStudent] = q.get('lesson');
      render();
      const row = document.querySelector(`tr.st[data-s="${CSS.escape(openStudent)}"]`);
      if (row) row.scrollIntoView({ block: 'center' });
      return;
    }
    render();
  }

  function render() {
    $('all-lesson').innerHTML = options(data.state.self_paced ? '__self' : data.state.lesson, false, true);
    $('mode-note').textContent = data.state.self_paced
      ? 'Self-paced: each student moves to the next lesson when they finish the one they are on (new students start at lesson 1). Students you moved yourself stay where you put them.'
      : 'With class: you open each lesson yourself. Nobody goes backwards: a student ahead of the lesson you open keeps their place. Students you moved yourself keep their lesson until you set them back to "follow the course".';
    $('all-since').textContent = data.state.self_paced ? '' : `open since ${new Date(data.state.since).toLocaleDateString()} (${ago(data.state.since)})`;
    $('count').textContent = `${data.students.length} student${data.students.length === 1 ? '' : 's'} set up. Click a student for their answers and memos.`;
    $('students').innerHTML = `<thead><tr><th>Student</th><th>Set up</th><th>Lesson now</th><th>Lesson open for</th><th>Move to</th><th>Scores and memos</th><th>Last seen</th></tr></thead><tbody>${
      data.students.map(s => {
        const cur = lessonOf(s), n = nOf(cur);
        const chips = shownLessons(s).map(l => {
          const sc = lessonScore(s.student, l), st = status(s, l);
          return `<span class="chip ${st.key}" title="${esc(l.title)}: ${st.label}">L${l.n}: ${sc === null ? '–' : sc}${st.key === 'done' ? ' ✓' : ''}</span>`;
        }).join('');
        return `<tr class="st ${openStudent === s.student ? 'open' : ''}" data-s="${esc(s.student)}">
          <td><b>${esc(s.name || s.student)}</b><div class="muted"><a href="${esc(s.site)}" target="_blank" onclick="event.stopPropagation()">${esc(s.student)}</a></div></td>
          <td>${s.setup_at ? new Date(s.setup_at).toLocaleDateString() : '–'}</td>
          <td>${n ?? '–'}${s.lesson ? ` <span class="muted">(${s.lesson_auto ? 'set automatically' : 'moved'})</span>` : ''}${(s.self_paced ?? (s.lesson && !s.lesson_auto ? false : data.state.self_paced)) ? '<div class="muted">self-paced</div>' : ''}</td>
          <td>${ago(sinceOf(s))}</td>
          <td class="move"><div class="row"><select data-move="${esc(s.student)}">${options(s.self_paced === true ? '__self' : (s.lesson || ''), true, true)}</select><button data-go="${esc(s.student)}">Move</button></div></td>
          <td>${chips || '<span class="muted">–</span>'}</td>
          <td>${ago(s.last_seen)}</td></tr>${openStudent === s.student ? detail(s) : ''}`;
      }).join('')}</tbody>`;
  }

  // The open row shows one lesson: the one the student worked on last, unless the teacher picked another.
  const picked = {};
  const lastActivity = (student, l) => Math.max(0, ...data.attempts.filter(a => a.student === student && a.lesson === l.checker).map(a => +new Date(a.at)),
    ...data.memos.filter(m => m.student === student && m.lesson === l.checker && m.submitted_at).map(m => +new Date(m.submitted_at)));
  // Resetting a lesson for a student (as if they never started it): a two-step button.
  let resetArmed = null;
  const resetBar = (s, l) => {
    const k = `${s.student}|${l.checker}`, who = esc(nameOf(s.student));
    return resetArmed === k
      ? `<div class="resetbar armed"><b>Really reset lesson ${l.n} for ${who}?</b> Their tries, memo${l.checker === 'lesson-04' ? ', task' : ''}, saved answers, panels and views for this lesson are removed, as if they never started it. This can't be undone.
          <button class="danger" data-reset-go="${esc(k)}">Yes, reset</button> <button data-reset-cancel="1">Cancel</button></div>`
      : '';
  };
  const resetBtn = (s, l) => resetArmed === `${s.student}|${l.checker}` ? '' : `<button class="resetbtn" data-reset="${esc(`${s.student}|${l.checker}`)}">Reset</button>`;
  async function doReset(k) {
    const [student, lesson] = k.split('|'), l = lessons.find(x => x.checker === lesson), name = nameOf(student);
    resetArmed = null;
    const said = `Lesson ${l ? l.n : lesson} reset for ${name}. Their answers clear when they next open their site; their assistant clears their panels and views at its next session.`;
    if (DEMO) {
      data.attempts = data.attempts.filter(a => !(a.student === student && a.lesson === lesson));
      data.memos = data.memos.filter(m => !(m.student === student && m.lesson === lesson));
      data.giveups = (data.giveups || []).filter(g => !(g.student === student && g.lesson === lesson));
      render(); return note(said + ' (demo only)');
    }
    const { error } = await db.rpc('course_reset_lesson', { p_student: student, p_lesson: lesson });
    if (error) { render(); return note('Could not reset: ' + error.message, true); }
    await load(); note(said);
  }
  function detail(s) {
    const ls = shownLessons(s);
    if (!ls.length) return `<tr class="detail"><td colspan="7"><span class="muted">No graded lessons yet.</span></td></tr>`;
    const latest = ls.reduce((a, b) => lastActivity(s.student, b) > lastActivity(s.student, a) ? b : a, ls[ls.length - 1]);
    const l = ls.find(x => x.checker === picked[s.student]) || latest;
    const qs = questions[l.checker] || [], m = memoOf(s.student, l), sc = lessonScore(s.student, l);
    const pick = ls.map(x => `<button data-pick="${esc(x.checker)}" data-who="${esc(s.student)}" class="${x === l ? 'on' : ''}">L${x.n} · ${status(s, x).label}</button>`).join('');
    const st = status(s, l);
    const own = DEMO ? [] : answersFor(s.student, l.checker);
    const rows = qs.map((q, i) => {
      const tries = data.attempts.filter(a => a.student === s.student && a.lesson === l.checker && a.question === q.id);
      const mine = own.find(o => o.id === q.id) || {};
      const text = mine.text || q.text;
      const gu = (data.giveups || []).find(g => g.student === s.student && g.lesson === l.checker && g.question === q.id);
      return `<tr><td class="qn">${i + 1}</td><td class="qx" title="${esc(text)}">${esc(text)}${gu ? `<div class="gu"><b>Gave up</b> · ${esc(gu.text)}</div>` : ''}</td>
        <td class="ans" title="Right answer for this student">${mine.answer ? cellsOf(mine.answer) + (DEMO ? '' : `<button class="linkish how-btn" data-how="${esc(s.student)}|${esc(l.checker)}|${esc(q.id)}">${explained[`${s.student}|${l.checker}|${q.id}`] ? 'hide' : 'how?'}</button>`) : ''}</td>
        <td class="tries">${tries.map((t, k) => `<span class="${t.is_right ? 'r' : ''}"><i>${k + 1}</i>${cellsOf(t.answer)}</span>`).join('') || '<span class="muted" style="background:none;color:#8A8A85">not tried</span>'}</td>
        <td class="pts">${tries.length ? scoreQuestion(tries) : 0}</td></tr>${howRow(`${s.student}|${l.checker}|${q.id}`)}`;
    }).join('');
    const memo = m && m.text
      ? `<details class="m" ${m.submitted_at ? '' : 'open'}><summary><b>Memo</b> · ${m.submitted_at ? 'submitted ' + new Date(m.submitted_at).toLocaleString() : 'withdrawn for editing'}</summary><div class="memo">${esc(m.text)}</div></details>`
      : `<div class="muted" style="margin-top:8px"><b>Memo</b> · not sent</div>`;
    return `<tr class="detail"><td colspan="7"><div class="pick">${pick}</div>
      <div class="lesson-block"><div class="lesson-head"><h3>Lesson ${l.n} · ${esc(l.title)} · score ${sc ?? '–'} <span class="chip ${st.key}">${st.label}</span></h3>${resetBtn(s, l)}</div>${resetBar(s, l)}<table class="qt">${rows}</table>${memo}</div></td></tr>`;
  }

  // A line under the heading confirms every change, or shows what went wrong.
  function note(text, bad) {
    const el = $('note'); el.textContent = text; el.className = bad ? 'bad' : 'ok'; el.hidden = false;
    clearTimeout(note.t); note.t = setTimeout(() => { el.hidden = true; }, 8000);
  }
  const titleOf = unit => { const l = lessons.find(x => x.unit === unit); return l ? `lesson ${l.n} (${l.title})` : 'the course'; };
  const nameOf = student => { const s = data.students.find(x => x.student === student); return s ? (s.name || s.student) : student; };
  async function setSelfPaced(student, value) {   // value: true, false, or null (a student: follow the course)
    const said = student === null ? (value ? 'Self-paced is on for the course: students move on as they finish.' : 'Self-paced is off for the course: you open lessons yourself.')
      : value === null ? `${nameOf(student)} now follows the course's self-paced setting.`
      : `Self-paced is ${value ? 'on' : 'off'} for ${nameOf(student)}.`;
    if (DEMO) {
      if (student === null) data.state.self_paced = !!value; else data.students.find(s => s.student === student).self_paced = value;
      render(); return note(said + ' (demo only)');
    }
    const { error } = await db.rpc('course_set_self_paced', { p_student: student, p_value: value });
    if (error) return note('Could not change self-paced: ' + error.message, true);
    await load(); note(said);
  }
  async function setLesson(student, lesson) {
    const said = student === null ? `Opened ${titleOf(lesson)} for everyone (with class: self-paced is off).`
      : lesson ? `Moved ${nameOf(student)} to ${titleOf(lesson)}. Their site follows within seconds (they may need to reload).`
      : `${nameOf(student)} now follows the course again.`;
    if (DEMO) {
      if (student === null) { Object.assign(data.state, { lesson, since: new Date().toISOString(), self_paced: false }); data.students.filter(s => s.lesson_auto).forEach(s => Object.assign(s, { lesson: null, lesson_auto: false })); }
      else Object.assign(data.students.find(s => s.student === student), { lesson, lesson_since: lesson ? new Date().toISOString() : null, lesson_auto: false, self_paced: lesson ? false : null });
      render(); return note(said + ' (demo only)');
    }
    const { error } = await db.rpc('course_set_lesson', { p_student: student, p_lesson: lesson });
    if (error) return note('Could not change the lesson: ' + error.message, true);
    await load(); note(said);
  }

  $('students').addEventListener('click', (e) => {
    const pk = e.target.closest('[data-pick]');
    if (pk) { picked[pk.dataset.who] = pk.dataset.pick; render(); return; }
    const rs = e.target.closest('[data-reset]');
    if (rs) { resetArmed = rs.dataset.reset; render(); return; }
    if (e.target.closest('[data-reset-cancel]')) { resetArmed = null; render(); return; }
    const rg = e.target.closest('[data-reset-go]');
    if (rg) { doReset(rg.dataset.resetGo); return; }
    const hw = e.target.closest('[data-how]');
    if (hw) { explain(hw.dataset.how); return; }
    if (e.target.closest('tr.detail')) return;
    const go = e.target.closest('[data-go]');
    if (go) { const s = go.dataset.go; apply(s, document.querySelector(`select[data-move="${CSS.escape(s)}"]`).value); return; }
    if (e.target.closest('td.move')) return;   // the dropdown and button don't open the row
    const tr = e.target.closest('tr.st'); if (!tr) return;
    openStudent = openStudent === tr.dataset.s ? null : tr.dataset.s; render();
  });
  // One dropdown for both: a lesson (with class: you decide) or Self-paced (they move on as they finish).
  const apply = (student, value) => value === '__self' ? setSelfPaced(student, true) : setLesson(student, value || null);
  $('open-all').addEventListener('click', () => apply(null, $('all-lesson').value));
  $('refresh').addEventListener('click', load);
  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { error } = await db.auth.signInWithPassword({ email: $('email').value, password: $('password').value });
    $('login-error').textContent = error ? error.message : ''; show();
  });
  $('signout').addEventListener('click', async () => { await db.auth.signOut(); show(); });

  async function show() {
    if (DEMO) {
      $('login').hidden = true; $('app').hidden = false;
      document.querySelector('header h1').innerHTML = 'Teacher dashboard <span class="chip part">demo: made-up students</span>';
      await loadCourse(); load(); return;
    }
    const { data: { session } } = await db.auth.getSession();
    $('login').hidden = !!session; $('app').hidden = !session;
    if (session) { if (!lessons.length) await loadCourse(); load(); }
  }
  show();
</script>
</body>
</html>
